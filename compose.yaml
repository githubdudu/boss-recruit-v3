services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks: [app_net]
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URL=mongodb://db:27017/bossrecruit
    depends_on:
      db:
        condition: service_healthy
    networks: [app_net]
  # One-shot seeder: docker compose --profile seed run --rm seed
  # Not in the default profile because init_db.js wipes the collections first.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles: ["seed"]
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGO_URL=mongodb://db:27017/bossrecruit
    command: npm run init_db
    depends_on:
      db:
        condition: service_healthy
    networks: [app_net]
  db:
    image: mongodb/mongodb-community-server:8.0-ubi8-slim
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app_net]

volumes:
  mongo_data:

networks:
  app_net:
    name: app_network
